[workspace]
resolver = "3"
members = [
    "crates/kikoe-core",
    "crates/kikoe-asr",
    "crates/kikoe-capture",
    "crates/kikoe-mt",
    "crates/kikoe-eval",
    "app/src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
kikoe-core = { path = "crates/kikoe-core" }
kikoe-asr = { path = "crates/kikoe-asr" }
kikoe-capture = { path = "crates/kikoe-capture" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
